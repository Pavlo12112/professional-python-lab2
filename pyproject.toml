[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "data-processor"
version = "0.1.0"
description = "Laboratory work 2: data structures and functional decomposition"
requires-python = ">=3.11"

[project.scripts]
data-processor = "data_processor.main:main"

[tool.setuptools.packages.find]
where = ["src"]
